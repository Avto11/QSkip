<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QSkip — 404 / Page Not Found</title>
  
  <!-- Custom Favicon -->
  <link rel="icon" type="image/png" href="error.png">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Hide scrollbar */
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }
    html, body { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col justify-between p-6 relative overflow-hidden font-sans select-none">

  <!-- Background Glow -->
  <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-emerald-200/50 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Header -->
  <header class="max-w-6xl w-full mx-auto flex justify-between items-center z-10">
    <a href="/" class="bg-white px-3.5 py-1.5 rounded-xl border border-slate-200 shadow-sm hover:bg-slate-100 transition-all">
      <span class="font-bold text-xl tracking-wide text-slate-900">QSkip</span>
    </a>

    <a href="/" class="text-sm text-slate-500 hover:text-slate-900 transition-colors">
      ← მთავარი / Home
    </a>
  </header>

  <!-- Main Centered Content -->
  <main class="text-center z-10 my-auto space-y-4 max-w-lg mx-auto">
    <!-- 404 Badge -->
    <span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold uppercase tracking-wider bg-emerald-50 text-emerald-700 border border-emerald-200">
      <i class="fa-solid fa-triangle-exclamation mr-1.5"></i> შეცდომა 404 / Error 404
    </span>

    <!-- Gradient Big 404 -->
    <h1 class="text-6xl sm:text-8xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-500 to-blue-600 py-1 leading-none">
      404
    </h1>

    <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 tracking-tight">
      გვერდი ვერ მოიძებნა / Page Not Found
    </h2>
    
    <!-- Description -->
    <p class="text-slate-600 text-sm sm:text-base font-normal leading-relaxed">
      სამწუხაროდ, გვერდი არ არსებობს. <br class="hidden sm:inline" />
      Sorry, the page you are looking for does not exist.
    </p>

    <!-- Action Button -->
    <div class="pt-3">
      <a href="/" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm shadow-md transition-all hover:shadow-lg">
        <i class="fa-solid fa-house text-xs"></i> მთავარ გვერდზე დაბრუნება / Back to Home
      </a>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-slate-500 z-10">
    © <span id="year"></span> QSkip
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
