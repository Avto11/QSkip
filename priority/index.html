<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSkip - Interactive Pricing Calculator & Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background-color: #0c1017;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background-color: #141923;
      border: 1px solid #1f2838;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
      width: 100%;
      max-width: 750px;
      box-sizing: border-box;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #ffffff;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
    }
    
    /* Input and Price Display Section */
    .calculator-box {
      background-color: #1b2332;
      border: 1px solid #2a364d;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .input-group label {
      color: #8a99ad;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-wrapper {
      display: flex;
      align-items: center;
    }
    .input-wrapper input {
      background-color: #0c1017;
      border: 2px solid #0062E6;
      border-radius: 10px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      padding: 10px 14px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .input-wrapper input:focus {
      border-color: #2ECC71;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
    }
    
    /* Price Result Display */
    .price-display {
      background-color: #0c1017;
      border: 1px solid #2ECC71;
      border-radius: 10px;
      padding: 10px 20px;
      text-align: right;
      min-width: 150px;
    }
    .price-display .label {
      color: #8a99ad;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .price-display .value {
      color: #2ECC71;
      font-size: 26px;
      font-weight: 800;
    }

    /* Canvas styling */
    .chart-container {
      position: relative;
      width: 100%;
    }

    @media (max-width: 500px) {
      .calculator-box {
        flex-direction: column;
        align-items: stretch;
      }
      .price-display {
        text-align: center;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>QSkip Dynamic Pricing</h2>
    
    <!-- TOP INPUT FIELD & PRICE RESULT -->
    <div class="calculator-box">
      <div class="input-group">
        <label for="queueInput">Enter People in Queue (n)</label>
        <div class="input-wrapper">
          <input type="number" id="queueInput" value="25" min="0" max="100" step="1" oninput="updateCalculator()">
        </div>
      </div>
      
      <div class="price-display">
        <div class="label">Calculated Price</div>
        <div class="value" id="priceOutput">4.00 GEL</div>
      </div>
    </div>

    <!-- GRAPH BELOW -->
    <div class="chart-container">
      <canvas id="qskipChart"></canvas>
    </div>
  </div>

  <script>
    // Exact piecewise algorithm
    function calculatePrice(n) {
      if (n < 0) n = 0;
      let price = 2.00;
      if (n <= 10) {
        price = 2.00;
      } else if (n <= 25) {
        price = 2.00 + (n - 10) * (2.00 / 15.0);
      } else if (n <= 50) {
        price = 4.00 + (n - 25) * (3.00 / 25.0);
      } else if (n <= 75) {
        price = 7.00 + (n - 50) * (3.00 / 25.0);
      } else {
        price = 10.00;
      }
      return price;
    }

    // Populate discrete integer points (0 to 85)
    const labels = [];
    const dataPoints = [];
    for (let n = 0; n <= 85; n++) {
      labels.push(n);
      dataPoints.push(calculatePrice(n));
    }

    const ctx = document.getElementById('qskipChart').getContext('2d');

    // QSkip Brand Gradients
    const gradient = ctx.createLinearGradient(0, 0, 0, 350);
    gradient.addColorStop(0, 'rgba(46, 204, 113, 0.35)');  // Green
    gradient.addColorStop(0.5, 'rgba(0, 98, 230, 0.15)');  // Blue
    gradient.addColorStop(1, 'rgba(20, 25, 35, 0.0)');

    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Price (GEL)',
          data: dataPoints,
          borderColor: '#2ECC71',
          borderWidth: 3,
          backgroundColor: gradient,
          fill: true,
          tension: 0,
          pointRadius: 0,
          pointHoverRadius: 8,
          pointHoverBackgroundColor: '#2ECC71',
          pointHoverBorderColor: '#ffffff',
          pointHoverBorderWidth: 2
        }]
      },
      options: {
        responsive: true,
        interaction: {
          mode: 'index',
          intersect: false
        },
        plugins: {
          legend: { display: false },
          tooltip: {
            enabled: true,
            backgroundColor: '#1b2332',
            titleColor: '#8a99ad',
            bodyColor: '#2ECC71',
            borderColor: '#0062E6',
            borderWidth: 1.5,
            padding: 12,
            displayColors: false,
            callbacks: {
              title: (items) => `Queue Size: ${items[0].label} people`,
              label: (item) => `Skip Price: ${item.parsed.y.toFixed(2)} GEL`
            }
          }
        },
        scales: {
          x: {
            title: {
              display: true,
              text: 'Number of People in Queue (n)',
              color: '#8a99ad',
              font: { size: 12, weight: 'bold' }
            },
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            ticks: { 
              color: '#8a99ad',
              callback: function(value, index) {
                return index % 10 === 0 ? value : '';
              }
            }
          },
          y: {
            title: {
              display: true,
              text: 'Skip Price (GEL)',
              color: '#8a99ad',
              font: { size: 12, weight: 'bold' }
            },
            grid: { color: 'rgba(255, 255, 255, 0.05)' },
            ticks: { 
              color: '#8a99ad',
              callback: (value) => value.toFixed(2) + ' GEL'
            },
            min: 0,
            max: 12
          }
        }
      }
    });

    // Sync function between input box & graph display
    function updateCalculator() {
      const inputEl = document.getElementById('queueInput');
      let n = parseInt(inputEl.value);

      if (isNaN(n) || n < 0) n = 0;

      const price = calculatePrice(n);
      document.getElementById('priceOutput').innerText = price.toFixed(2) + ' GEL';

      // Highlight point on the chart if within dataset bounds
      if (n <= 85) {
        chart.setActiveElements([{ datasetIndex: 0, index: n }]);
        chart.tooltip.setActiveElements([{ datasetIndex: 0, index: n }], { x: 0, y: 0 });
      } else {
        chart.setActiveElements([]);
        chart.tooltip.setActiveElements([], { x: 0, y: 0 });
      }
      chart.update();
    }

    // Initialize default highlight on page load
    document.addEventListener('DOMContentLoaded', updateCalculator);
  </script>
</body>
</html>
