<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSkip პრიორიტეტული რიგი</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #0c1017;
      --card-bg: #141923;
      --card-border: #1f2838;
      --accent-gold: #d4af37;
      --accent-green: #2ECC71;
      --accent-blue: #0062E6;
      --text-muted: #8a99ad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 16px;
    }

    .container {
      width: 100%;
      max-width: 650px;
    }

    /* Base View Container Transition */
    .view-section {
      width: 100%;
      transition: opacity 0.25s ease-in-out;
    }

    .hidden {
      display: none !important;
    }

    /* MENU VIEW DESIGN */
    .header-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(212, 175, 55, 0.05);
    }

    .option-card.interactive {
      cursor: pointer;
    }

    .option-card.interactive:hover, .option-card.interactive:active {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.15);
    }

    .option-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
    }

    .price-strike {
      text-decoration: line-through;
      color: var(--text-muted);
      font-size: 13px;
      margin-right: 6px;
    }

    .price-badge {
      background-color: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .action-prompt {
      font-size: 13px;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    /* FOOTER / CONTACT CARD */
    .contact-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 20px;
      box-shadow: 0 4px 20px rgba(212, 175, 55, 0.1);
    }

    .contact-info {
      font-size: 15px;
      color: #ffffff;
    }

    .contact-info a {
      color: var(--accent-gold);
      text-decoration: none;
      font-weight: 700;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    /* CALCULATOR VIEW DESIGN */
    .nav-back-btn {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      transition: all 0.2s;
    }

    .nav-back-btn:hover {
      background-color: var(--card-bg);
      color: #ffffff;
      border-color: #ffffff;
    }

    .calculator-card {
      background-color: var(--card-bg);
      border: 1px solid var(--accent-gold);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }

    .calculator-card h2 {
      margin-bottom: 20px;
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
    }

    .calculator-box {
      background-color: #1b2332;
      border: 1px solid #2a364d;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .input-group label {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper input {
      background-color: var(--bg-dark);
      border: 2px solid var(--accent-blue);
      border-radius: 10px;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-wrapper input:focus {
      border-color: var(--accent-green);
    }

    .price-display {
      background-color: var(--bg-dark);
      border: 1px solid var(--accent-green);
      border-radius: 10px;
      padding: 10px 16px;
      text-align: right;
      min-width: 130px;
    }

    .price-display .label {
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .price-display .value {
      color: var(--accent-green);
      font-size: 22px;
      font-weight: 800;
    }

    .chart-container {
      position: relative;
      width: 100%;
    }

    /* RESPONSIVE BREAKPOINTS */
    @media (max-width: 500px) {
      .calculator-box {
        flex-direction: column;
        align-items: stretch;
      }

      .price-display {
        text-align: center;
      }

      .calculator-card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- MENU VIEW -->
    <div id="menuView" class="view-section">
      <div class="header-card">
        <div class="header-title">პრიორიტეტული რიგები</div>
      </div>

      <div class="options-list">
        <!-- Option 1: QSkip+ Subscription -->
        <div class="option-card">
          <div class="option-header">
            <div class="option-title">QSkip+</div>
            <div>
              <span class="price-strike">20₾/თვეში</span>
              <span class="price-badge">15₾/თვეში</span>
            </div>
          </div>
        </div>

        <!-- Option 2: One-time Dynamic Pass -->
        <div class="option-card interactive" onclick="openCalculator()">
          <div class="option-header">
            <div class="option-title">ერთჯერადი დინამიური გადასახადი</div>
          </div>
          <div class="action-prompt">
            <span>ნახეთ კალკულატორი და გრაფიკი</span> &rarr;
          </div>
        </div>
      </div>

      <!-- Footer Contact Card -->
      <div class="contact-card">
        <div class="contact-info">
          შეძენისთვის დაგვიკავშირდით: <a href="mailto:contact@qskip.ge">contact@qskip.ge</a>
        </div>
      </div>
    </div>

    <!-- CALCULATOR VIEW -->
    <div id="calculatorView" class="view-section hidden">
      <button class="nav-back-btn" onclick="openMenu()">&larr; უკან დაბრუნება</button>

      <div class="calculator-card">
        <h2>QSkip Dynamic Pricing</h2>
        
        <div class="calculator-box">
          <div class="input-group">
            <label for="queueInput">Enter People in Queue (n)</label>
            <div class="input-wrapper">
              <input type="number" id="queueInput" value="25" min="0" max="100" step="1" oninput="updateCalculator()">
            </div>
          </div>
          
          <div class="price-display">
            <div class="label">Calculated Price</div>
            <div class="value" id="priceOutput">4.00 GEL</div>
          </div>
        </div>

        <div class="chart-container">
          <canvas id="qskipChart"></canvas>
        </div>
      </div>
    </div>

  </div>

  <script>
    let chartInstance = null;

    function calculatePrice(n) {
      if (n < 0) n = 0;
      let price = 2.00;
      if (n <= 10) {
        price = 2.00;
      } else if (n <= 25) {
        price = 2.00 + (n - 10) * (2.00 / 15.0);
      } else if (n <= 50) {
        price = 4.00 + (n - 25) * (3.00 / 25.0);
      } else if (n <= 75) {
        price = 7.00 + (n - 50) * (3.00 / 25.0);
      } else {
        price = 10.00;
      }
      return price;
    }

    function openCalculator() {
      document.getElementById('menuView').classList.add('hidden');
      document.getElementById('calculatorView').classList.remove('hidden');
      
      if (!chartInstance) {
        initChart();
      }
      updateCalculator();
    }

    function openMenu() {
      document.getElementById('calculatorView').classList.add('hidden');
      document.getElementById('menuView').classList.remove('hidden');
    }

    function initChart() {
      const labels = [];
      const dataPoints = [];
      for (let n = 0; n <= 85; n++) {
        labels.push(n);
        dataPoints.push(calculatePrice(n));
      }

      const ctx = document.getElementById('qskipChart').getContext('2d');

      const gradient = ctx.createLinearGradient(0, 0, 0, 300);
      gradient.addColorStop(0, 'rgba(46, 204, 113, 0.35)');
      gradient.addColorStop(0.5, 'rgba(0, 98, 230, 0.15)');
      gradient.addColorStop(1, 'rgba(20, 25, 35, 0.0)');

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: 'Price (GEL)',
            data: dataPoints,
            borderColor: '#2ECC71',
            borderWidth: 3,
            backgroundColor: gradient,
            fill: true,
            tension: 0,
            pointRadius: 0,
            pointHoverRadius: 8,
            pointHoverBackgroundColor: '#2ECC71',
            pointHoverBorderColor: '#ffffff',
            pointHoverBorderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          interaction: {
            mode: 'index',
            intersect: false
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              backgroundColor: '#1b2332',
              titleColor: '#8a99ad',
              bodyColor: '#2ECC71',
              borderColor: '#0062E6',
              borderWidth: 1.5,
              padding: 10,
              displayColors: false,
              callbacks: {
                title: (items) => `Queue Size: ${items[0].label} people`,
                label: (item) => `Skip Price: ${item.parsed.y.toFixed(2)} GEL`
              }
            }
          },
          scales: {
            x: {
              title: {
                display: true,
                text: 'Number of People in Queue (n)',
                color: '#8a99ad',
                font: { size: 11, weight: 'bold' }
              },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { 
                color: '#8a99ad',
                callback: function(value, index) {
                  return index % 10 === 0 ? value : '';
                }
              }
            },
            y: {
              title: {
                display: true,
                text: 'Skip Price (GEL)',
                color: '#8a99ad',
                font: { size: 11, weight: 'bold' }
              },
              grid: { color: 'rgba(255, 255, 255, 0.05)' },
              ticks: { 
                color: '#8a99ad',
                callback: (value) => value.toFixed(2) + ' GEL'
              },
              min: 0,
              max: 12
            }
          }
        }
      });
    }

    function updateCalculator() {
      if (!chartInstance) return;
      const inputEl = document.getElementById('queueInput');
      let n = parseInt(inputEl.value);

      if (isNaN(n) || n < 0) n = 0;

      const price = calculatePrice(n);
      document.getElementById('priceOutput').innerText = price.toFixed(2) + ' GEL';

      if (n <= 85) {
        chartInstance.setActiveElements([{ datasetIndex: 0, index: n }]);
        chartInstance.tooltip.setActiveElements([{ datasetIndex: 0, index: n }], { x: 0, y: 0 });
      } else {
        chartInstance.setActiveElements([]);
        chartInstance.tooltip.setActiveElements([], { x: 0, y: 0 });
      }
      chartInstance.update();
    }
  </script>
</body>
</html>
