<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSkip.ge — Dynamic Pricing Calculator</title>
    <style>
        :root {
            --bg-color: #0F172A;
            --card-bg: #1E293B;
            --accent-cyan: #00E5FF;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .calculator-card {
            max-width: 650px;
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        header {
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .logo span {
            color: var(--accent-cyan);
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        .input-section {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .input-group {
            width: 100%;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
        }

        label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px 18px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent-cyan);
        }

        .price-display {
            text-align: center;
            margin-top: 8px;
        }

        .price-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .price-value {
            font-size: 44px;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-top: 2px;
        }

        .graph-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .graph-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .graph-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .graph-container img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="calculator-card">
        <header>
            <div class="logo">Q<span>Skip</span>.ge</div>
            <p class="subtitle">Dynamic Skip Fee Calculator</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <label for="peopleCount">People Ahead in Queue</label>
                <input type="number" id="peopleCount" min="1" max="150" value="25" placeholder="e.g. 25">
            </div>

            <div class="price-display">
                <div class="price-label">One-Time Priority Skip Fee</div>
                <div class="price-value" id="calculatedPrice">4.00 GEL</div>
            </div>
        </div>

        <div class="graph-section">
            <div class="graph-title">Pricing Progression Curve</div>
            <div class="graph-container">
                <img src="qskip_pricing_graph.png" alt="QSkip Dynamic Pricing Curve">
            </div>
        </div>
    </div>

    <script>
        function calculateSkipPrice(n) {
            if (n <= 0 || isNaN(n)) return "0.00 GEL";
            
            let price = 2.00;
            if (n <= 10) {
                price = 2.00;
            } else if (n <= 25) {
                price = 2.00 + (n - 10) * (2.00 / 15.0);
            } else if (n <= 50) {
                price = 4.00 + (n - 25) * (3.00 / 25.0);
            } else if (n <= 75) {
                price = 7.00 + (n - 50) * (3.00 / 25.0);
            } else {
                price = 10.00;
            }

            return price.toFixed(2) + " GEL";
        }

        const input = document.getElementById('peopleCount');
        const display = document.getElementById('calculatedPrice');

        input.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            display.textContent = calculateSkipPrice(val);
        });
    </script>
</body>
</html>
